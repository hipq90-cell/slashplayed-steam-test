name: Build Slashplayed Steam test 2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Fetch pinned official source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulstraw/slashplayed
          ref: 1e940dd094d7bc79a0747045634c4a732993db34
          path: upstream
          persist-credentials: false
      - name: Apply Steam test 2 patch
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, gzip, os, pathlib, subprocess
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'steam-test2.patch'
          patch.write_bytes(gzip.decompress(base64.b64decode("")))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          PYCODE
      - name: Test mappings and compile iOS cursor-menu fix
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-tree.sh
          bash steam-bridge/build-macos.sh
      - name: Upload test 2 installation kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slashplayed-steam-test2
          if-no-files-found: error
          retention-days: 14
          path: |
            upstream/build/steam/slashplayed-steam-test2-kit.zip
            upstream/build/steam/SHA256SUMS
