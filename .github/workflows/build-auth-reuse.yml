name: Build Windows auth reuse test 1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
      PYTHON: python
    steps:
      - name: Keep source line endings
        run: git config --global core.autocrlf false
      - name: Fetch pinned official source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulstraw/slashplayed
          ref: 1e940dd094d7bc79a0747045634c4a732993db34
          path: upstream
          persist-credentials: false
      - name: Apply auth reuse patch
        working-directory: upstream
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64, gzip, os, pathlib, subprocess
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'auth-reuse.patch'
          patch.write_bytes(gzip.decompress(base64.b64decode("")))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          PYCODE
          bash scripts/check-tree.sh
      - name: Prepare pinned Rust, signer source, and notices
        working-directory: upstream
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          bash scripts/build-zsign.sh source
          bash scripts/fetch-font.sh
      - name: Test without real credentials or Apple requests
        working-directory: upstream/apps/companion-rs
        run: |
          set -euo pipefail
          cargo test --locked --lib account::tests
          cargo test --locked --lib provision::tests
          cargo test --locked --bin slashplayed-cli
      - name: Build and package Windows programs
        working-directory: upstream
        run: |
          set -euo pipefail
          cd apps/companion-rs
          cargo build --release --locked --target x86_64-pc-windows-msvc
          cd ../..
          bash apps/companion-rs/package.sh x86_64-pc-windows-msvc dist/original
          python - <<'PYCODE'
          import pathlib, zipfile
          src = next(pathlib.Path('dist/original').glob('*.zip'))
          dst = pathlib.Path('dist/slashplayed-auth-reuse-windows.zip')
          count = 0
          with zipfile.ZipFile(src) as z, zipfile.ZipFile(dst,'w',zipfile.ZIP_DEFLATED) as out:
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.name in ['Slashplayed Companion.exe','Goodmountain-Regular.otf']:
                      continue
                  data = z.read(info)
                  if p.name == 'slashplayed-cli.exe':
                      info.filename = str(p.with_name('slashplayed-cli-reuse.exe'))
                      count += 1
                  if p.name == 'README.txt':
                      data = b'Experimental auth-reuse-test1. Use slashplayed-cli-reuse.exe --help. Requires an existing Slashplayed signing key, iLoader machine identity, the matching --anisette server, --reuse-iloader-anisette, and --kit. No certificate creation/revocation in reuse mode. Do not delete the existing iPad app.\n'
                  out.writestr(info,data)
          assert count == 1, 'CLI executable missing from original package'
          PYCODE
      - name: Upload Windows installer tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slashplayed-auth-reuse-test1
          retention-days: 14
          if-no-files-found: error
          path: upstream/dist/slashplayed-auth-reuse-windows.zip
