name: Build Slashplayed Steam left pad 1.3.1
on:
  workflow_dispatch:
    inputs:
      existing_bundle_id:
        description: 'Optional: exact existing app Bundle ID to also create an unsigned IPA; leave empty for the working kit install route'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Fetch pinned Slashplayed 1.6.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulstraw/slashplayed
          ref: 1e940dd094d7bc79a0747045634c4a732993db34
          path: upstream
          persist-credentials: false
      - name: Apply preserved Vader bridge and raw Steam left-pad changes
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, gzip, os, pathlib, subprocess
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'steam-leftpad.patch'
          patch.write_bytes(gzip.decompress(base64.b64decode("")))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          subprocess.run(['git', 'add', '-N', '.'], check=True)
          PYCODE
      - name: Fetch and verify the original Vader installation kit
        working-directory: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 steam-bridge/fetch-base-kit.py --repository "$SOURCE_REPOSITORY"
      - name: Test input and preservation, compile iOS AppKit, and package
        working-directory: upstream
        shell: bash
        env:
          EXISTING_BUNDLE_ID: ${{ inputs.existing_bundle_id }}
        run: |
          set -euo pipefail
          bash scripts/check-tree.sh
          xcrun --sdk iphoneos --show-sdk-version > build/leftpad/SDK-VERSION.txt
          bash steam-bridge/build-macos.sh "$PWD/build/leftpad/base-kit.zip" "$EXISTING_BUNDLE_ID" 2>&1 | tee build/leftpad/BUILD.log
      - name: Upload the controller update kit and optional unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slashplayed-steam-leftpad-1.3.1
          if-no-files-found: error
          retention-days: 14
          path: |
            upstream/build/leftpad/slashplayed-steam-leftpad-kit-1.3.1.zip
            upstream/build/leftpad/Slashplayed-Steam-LeftPad-unsigned-1.3.1.ipa
            upstream/build/leftpad/SHA256SUMS
            upstream/build/leftpad/BUILD-VALIDATION.json
            upstream/build/leftpad/BUILD.log
            upstream/build/leftpad/SDK-VERSION.txt
